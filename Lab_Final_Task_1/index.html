<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online cafe food ordering system</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <h1>Campus Cafe</h1>
        <p class="subtitle">Online Food Ordering System</p>

        <form id="orderForm">


            <section class="form-section">
                <h2>Customer Information</h2>


                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">
                    <span class="error" id="nameError"></span>
                </div>


                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com">
                    <span class="error" id="emailError"></span>
                </div>


                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="Enter your phone number">
                    <span class="error" id="phoneError"></span>
                </div>


                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" name="studentId" placeholder="Example: 23-12345-1">
                    <span class="error" id="studentIdError"></span>
                </div>


                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male">Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">Female
                        </label>
                    </div>

                    <span class="error" id="genderError"></span>
                </div>


                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department" name="department">
                        <option value="">-- Select Department --</option>
                        <option value="CSE">CSE</option>
                        <option value="EEE">EEE</option>
                        <option value="BBA">BBA</option>
                    </select>

                    <span class="error" id="departmentError"></span>
                </div>

            </section>



            <section class="form-section">

                <h2>Food Selection</h2>

                <p class="instruction">
                    Select one or more food items:
                </p>

                <div class="food-container">


                    <label class="food-item">
                        <input type="checkbox" name="food" value="Burger" data-price="5">

                        <span class="food-name">Burger</span>
                        <span class="price">$5</span>
                    </label>



                    <label class="food-item">
                        <input type="checkbox" name="food" value="Pizza" data-price="8">

                        <span class="food-name">Pizza</span>
                        <span class="price">$8</span>
                    </label>



                    <label class="food-item">
                        <input type="checkbox" name="food" value="Sandwich" data-price="4">

                        <span class="food-name">Sandwich</span>
                        <span class="price">$4</span>
                    </label>



                    <label class="food-item">
                        <input type="checkbox" name="food" value="French Fries" data-price="3">

                        <span class="food-name">French Fries</span>
                        <span class="price">$3</span>
                    </label>



                    <label class="food-item">
                        <input type="checkbox" name="food" value="Coffee" data-price="2">

                        <span class="food-name">Coffee</span>
                        <span class="price">$2</span>
                    </label>



                    <label class="food-item">
                        <input type="checkbox" name="food" value="Cold Drink" data-price="2">

                        <span class="food-name">Cold Drink</span>
                        <span class="price">$2</span>
                    </label>

                </div>

                <span class="error" id="foodError"></span>

                <div class="form-group">
                    <label for="quantity">Quantity</label>

                    <input type="number" id="quantity" name="quantity" min="1" placeholder="Enter quantity">

                    <span class="error" id="quantityError"></span>
                </div>



                <div class="form-group">

                    <label for="instructions">
                        Special Instructions
                    </label>

                    <textarea id="instructions" name="instructions" rows="4"
                        placeholder="Any special instructions? (Optional)">
                    </textarea>

                </div>

            </section>



            <button type="submit" class="order-btn">
                Place Order
            </button>

        </form>

        <div id="result" class="result hidden">

            <h2>Order Confirmation</h2>

            <div id="resultContent"></div>

        </div>

    </div>
    <script src="script.js"></script>


</body>

</html>
